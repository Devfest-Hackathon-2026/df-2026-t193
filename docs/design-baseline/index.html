<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>となりナビ — 새 구성</title><style>*{box-sizing:border-box}body{margin:0;background:#e7eceb;color:#26312e;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 30px;background:#fff;border-bottom:1px solid #d7dedb}header strong{font-size:16px}header span{font-size:12px;color:#66736e}a{color:#245b4c;text-underline-offset:4px}header a{font-size:13px}.layout{padding:26px 22px 40px;display:flex;align-items:center;flex-direction:column;gap:20px}.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}button{font:inherit;cursor:pointer;padding:10px 14px;border:1px solid #bac7c1;border-radius:7px;background:#fff;color:#324c41;font-size:13px;min-height:40px}button[aria-pressed=true]{background:#294b3c;color:#fff;border-color:#294b3c}label{font-size:13px;color:#4d6158;display:flex;align-items:center;gap:7px;margin-left:10px}input{width:18px;height:18px;accent-color:#294b3c}iframe{width:390px;height:844px;border:0;border-radius:0;outline:1px solid #c5d0ca;background:#fff;box-shadow:0 12px 36px #2c413015;max-width:100%;flex:none}.note{max-width:570px;font-size:13px;line-height:1.8;text-align:center;color:#566b60;margin:0}.note strong{font-weight:600;color:#294b3c}.status{font-size:13px;line-height:1.8;text-align:center;max-width:570px;color:#566b60;margin:0;min-height:23px}:focus-visible{outline:3px solid #0b57d0;outline-offset:4px}@media(max-width:600px){header{padding:16px 18px}header span{display:none}.layout{padding:18px 8px 25px;gap:16px}.note,.status{padding-inline:15px}}.screen-tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.screen-tabs button{min-width:68px}.screen-tabs [aria-current=true]{background:#0b57d0;border-color:#0b57d0;color:#fff}.overview-link{font-size:13px;padding:10px 4px;min-height:40px;display:inline-flex;align-items:center}</style></head><body><header><div><strong>となりナビ · 화면 흐름</strong> <span>승인된 안내 화면을 기준으로 확장</span></div><a id="open-screen" href="screen.html?view=start" target="_blank">화면만 열기 ↗</a></header><main class="layout"><nav class="screen-tabs" aria-label="화면 선택"><button data-view="start" aria-current="true">시작</button><button data-view="capture" aria-current="false">촬영</button><button data-view="guide" aria-current="false">안내</button><button data-view="choice" aria-current="false">선택</button><button data-view="done" aria-current="false">완료</button></nav><div class="tools"><button data-size="390,844" aria-pressed="true">390 × 844</button><button data-size="360,640" aria-pressed="false">360 × 640</button><label><input type="checkbox" id="large">글자 200%</label><button id="reset">처음 상태로</button><a class="overview-link" href="overview.html" target="_blank">전체 화면 보기 ↗</a></div><iframe src="screen.html?view=start" title="となりナビ 화면 시안"></iframe><p class="note"><strong>승인된 안내 화면과 같은 스타일로 시작·촬영·선택·완료를 연결했습니다.</strong><br>장면·화면은 새로 작성한 모의 단말이며 실제 병원 촬영물이 아닙니다.<br>카메라와 AI는 연결하지 않은 화면 시안입니다. 버튼으로 견본 흐름을 진행할 수 있습니다.<br>개인정보 입력 전에는 멈춤 안내를 표시하며, 실제 정보는 입력받지 않습니다.</p><p class="status" id="status" role="status">음성은 브라우저 내장 일본어 음성이 있을 때 재생됩니다. 실기·고령자 사용성은 미검증입니다.</p></main><script>
const frame=document.querySelector('iframe'),initialView=new URLSearchParams(location.search).get('view');if(['start','capture','guide','choice','done'].includes(initialView))frame.src='screen.html?view='+initialView;const names={start:'시작',capture:'촬영',guide:'안내',choice:'선택',done:'완료'};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({type:'select-view',view:b.dataset.view},'*'));
document.querySelector('#large').onchange=e=>frame.contentWindow.postMessage({type:'text-scale',large:e.target.checked},'*');
document.querySelector('#reset').onclick=()=>frame.contentWindow.postMessage({type:'reset'},'*');
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='reset-design')document.querySelector('#status').textContent=e.data.text;if(e.data?.type==='view-state'){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===e.data.view));document.querySelector('#open-screen').href='screen.html?view='+encodeURIComponent(e.data.view)+'&step='+encodeURIComponent(e.data.step);document.querySelector('#status').textContent='현재: '+names[e.data.view]+(e.data.selection?' · '+({internal:'内科',surgery:'外科',orthopedics:'整形外科'}[e.data.selection]):'')}});
</script></body></html>
